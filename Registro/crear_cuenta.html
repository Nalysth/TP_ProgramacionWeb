<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../img/logo_sin_fondo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="crear_cuenta.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="../index.html" class="titulo">GuanaTalk</a>
      </nav>
    </header>
    <main class="registro">
        <h1>Crea tu cuenta</h1>
      <form action="../html/pantallaPrincipal.html" id="form">
        <span id="mensaje"></span>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Juan" />

        <label for="usuario">Nombre Usuario</label>
        <input type="text" id="usuario" placeholder="pepe"/>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nombre@.com" />

        <label for="telefono">Telefono</label>
        <input type="tel" id="telefono" /> 

        <label for="password">Contraseña</label>
        <input type="password" id="password"  />

        <label for="r-password">Repetir contraseña</label>
        <input type="password" id="r-password" />

        <button type="submit">Registrarse</button>
        <a href="../index.html" class="cancelar">Cancelar</a>
    
      </form>
    </main>
    <footer>
      <section class="info-footer">
        <h3>Informacion</h3>
        <ul>
          <li><a href="../Contacto/contacto.html">Contacto</a></li>
          <li><a href="../Quienes Somos/quienes_somos.html">Quiénes somos</a></li>
          <li><a href="../Preguntas/preguntas_frecuentes.html">Preguntas frecuentes</a></li>
        </ul>
      </section>
      <section class="info-footer">
        <h3>Redes</h3>
        <ul>
          <li><a href="https://www.instagram.com/guanatalk.oficial/">Instagram</a></li>
          <li>
            <a href="https://www.facebook.com/profile.php?id=61595079205508">Facebook</a>
          </li>
          <li><a href="https://x.com/guanatalk">Twitter</a></li>
        </ul>
      </section>
    </footer>
    <script src="../js/usuarios.js"></script>
    <script src="registro.js"></script>
    
  </body>
</html>

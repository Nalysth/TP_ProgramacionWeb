<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../img/logo_sin_fondo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="crear_cuenta.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="../index.html" class="titulo">GuanaTalk</a>
      </nav>
    </header>
    <main class="registro">
        <h1>Crea tu cuenta</h1>
      <form action="../html/pantallaPrincipal.html">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Juan" required />

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" placeholder="Perez" required />

        <label for="usuario">Nombre Usuario</label>
        <input type="text" id="usuario" placeholder="pepe" required />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nombre@.com" required />

        <label for="telefono">Telefono</label>
        <input type="tel" id="telefono" required />

        <label for="nacionalidad">Nacionalidad:</label>

        <input
          type="text"
          id="nacionalidad"
          name="nacionalidad"
          list="nacionalidades"
        />

        <datalist id="nacionalidades">
          <option value="Argentina"></option>
          <option value="Brasil"></option>
          <option value="Chile"></option>
          <option value="Uruguay"></option>
        </datalist>

        <label for="password">Contrasenia</label>
        <input type="password" id="password" required />

        <label for="r-password">Repetir contrasenia</label>
        <input type="password" id="r-password" required />

        <button type="submit">Registrarse</button>
      </form>
    </main>
    <footer>
      <section class="info-footer">
        <h3>Informacion</h3>
        <ul>
          <li><a href="#">Contacto</a></li>
          <li><a href="#">Quiénes somos</a></li>
          <li><a href="#">Preguntas frecuentes</a></li>
        </ul>
      </section>
      <section class="info-footer">
        <h3>Redes</h3>
        <ul>
          <li><a href="https://www.instagram.com/">Instagram</a></li>
          <li>
            <a href="https://www.facebook.com/login/?locale=es_ES">Facebook</a>
          </li>
          <li><a href="https://x.com/?lang=es">Twitter</a></li>
        </ul>
      </section>
    </footer>
  </body>
</html>

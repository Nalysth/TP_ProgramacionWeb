    <body>
        <header>
            <nav class="navegador">
                <a href="../index.html" class="volver-inicio">
                <h1>GuanaTalk</h1>
                </a>
                <section>
                <ul class="opciones">
                    <li>
                    <a href="../html/pantallaPrincipal.html">

                    </li>
                    <li>
                    <a href="../Perfil de usuario y ajustes/perfil_usuario.html">

                    </li>
                    <li>
                    <a href="../Ranking/ranking.html">
                        <i class="fa-solid fa-star"></i>
                        <span>Ranking</span> 
                    </a>
                    </li>
                </ul>
                </section>

                <section class="racha">
                <i class="fa-solid fa-fire"></i>
                <h3>5 Días</h3>
                <i class="fa-solid fa-bolt"></i>
                <h3>350 XP</h3>

                <details>
                    <summary class="salida">

                </details>

        <main>
            <section class="sector1_vidas_progreso">
                <article class="progreso">
                    <article class="barra_progreso"><span class="text_progreso">PROGRESO %60</span></article>
                </article>
                <article class="vidas">
                    <span class="vida">❤</span>

                </article>
            </section>
            <section class="sector2_contenido">
                <article class="titulo_sec2_cont">TRADUCIR:</article>
                <article class="bloque_oracion">“我每天喝咖啡。” — Bebo café todos los días.</article>
                <article class="respesta">
                    <textarea class="text_area_respuesta" placeholder="Escribí tu respuesta"></textarea>
                </article>
            </section>
            <section class="sector3_palabras">
                <span class="palabra">我- yo</span>
                <span class="palabra">每天—todos los días</span>
                <span class="palabra">喝 — beber</span>
                <span class="palabra">咖啡 — café</span>
                <span class="palabra">很 — muy</span>
            </section>
            <section class="sector4_boton">
                    <a href=""><button class="boton_respuesta" type="submit">ENVIAR RESPUESTA</button></a>
            </section>
